seed: 42
device: cuda

data:
  path: /work/work_dzdrale/lwr_1d/hyperbolic_dataset.npz
  test_path: /work/work_dzdrale/lwr_1d/hyperbolic_dataset.npz
  path_local: /data/hyperbolic_dataset.npz
  test_path_local: /data/hyperbolic_dataset.npz
  nx: 128
  nt: 64
  x_min: -1.0
  x_max: 1.0
  t_max: 1.0
  cfl: 0.2
  num_samples: 5000
  test_num_samples: 10
  test_sine_pieces: 20
  ic_types: [piecewise_constant, piecewise_sine, riemann]
  num_segments:  [2, 5, 15, 20, 7]
  u_min: 0.0
  u_max: 1.0
  ic_points: 128
  method: muscl              # "godunov" (1st order) or "muscl" (2nd order MUSCL-Hancock)
  boundary: ghost
  train_fraction: 0.8
  val_fraction: 0.1
  compare_samples: 10
pinn:
  hidden_layers: 4
  hidden_width: 128
  activation: tanh
  epochs: 150
  lr: 5.0e-4
  batch_pdes: 1000
  interior_samples: 256
  initial_samples: 256
  boundary_samples: 128
  lambda_res: 1.0
  lambda_init: 1.0
  lambda_bc: 1.0
  hard_boundary: false
  save_path: hyperbolic_pde/runs/pinn.pt
  eval_samples: 5
  eval_plots: 3
  plot_dir: hyperbolic_pde/runs/plots/pinn

fno: # ~40 epochs for default data/batch config
  modes_x: 24
  modes_t: 24
  width: 128
  layers: 6
  epochs: 150
  lr: 1.0e-3
  weight_decay: 0.0
  grad_clip: null   
  lr_schedule: cosine
  lr_min: 5.0e-5
  lr_step: 5000
  lr_gamma: 0.5
  batch_size: 8
  checkpoint_every: 20
  save_path: hyperbolic_pde/runs/fno.pt
  eval_plots: 8
  plot_dir: hyperbolic_pde/runs/plots/fno

fno_experiment:
  modes_x: 32
  modes_t: 32
  width: 64
  layers: 6
  band_start: 125
  epochs: 200
  lr: 1.0e-3
  weight_decay: 0.0
  grad_clip: null
  lr_schedule: cosine
  lr_min: 5.0e-5
  lr_step: 5000
  lr_gamma: 0.5
  batch_size: 8
  checkpoint_every: 20
  save_path: hyperbolic_pde/runs/fno_experiment_epoch160_epoch60.pt
  eval_plots: 10
  plot_dir: hyperbolic_pde/runs/plots/fno_experiment

deeponet:
  branch_layers: 6
  trunk_layers: 6
  hidden_width: 128
  latent_dim: 128
  activation: tanh
  use_bias: true
  epochs: 150
  lr: 1.0e-3
  weight_decay: 0.0
  grad_clip: null
  lr_schedule: cosine
  lr_min: 5.0e-6
  lr_step: 5000
  lr_gamma: 0.5
  batch_size: 16
  save_path: hyperbolic_pde/runs/deeponet.pt
  eval_plots: 10
  plot_dir: hyperbolic_pde/runs/plots/deeponet

vpinn:
  hidden_layers: 8
  hidden_width: 256
  activation: tanh
  epochs: 150
  lr: 1.0e-3
  batch_pdes: 1000
  val_batch_pdes: 16
  interior_samples: 256
  initial_samples: 256
  boundary_samples: 128
  n_test: 2
  lambda_weak: 1.0
  lambda_init: 1.0
  lambda_bc: 0.1
  hard_boundary: false
  save_path: hyperbolic_pde/runs/vpinn.pt

gnn:
  hidden: 64
  layers: 5
  epochs: 250
  lr: 1.0e-3
  weight_decay: 0.0
  grad_clip: null
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_step: 5000
  lr_gamma: 0.5
  batch_size: 16
  save_path: hyperbolic_pde/runs/gnn.pt

hypgno:
  stencil_k: 3
  d_latent: 128
  d_hidden: 128
  d_time: 32
  n_layers: 8
  activation: gelu
  optimizer: adamw
  epochs: 500
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  lr_schedule: cosine
  lr_min: 1.0e-5
  batch_size: 32
  lambda_state: 1.0
  lambda_conservation: 1.0
  lambda_tv: 0.0
  checkpoint_every: 20
  save_path: hyperbolic_pde/runs/hypgno_epoch40.pt
  eval_plots: 10
  plot_dir: hyperbolic_pde/runs/plots/hypgno

hypno:
  resume_from: hyperbolic_pde/runs/hypn.pt
  stencil_k_x: 7
  stencil_k_t: 3
  d_latent: 64
  d_hidden: 64
  d_time: 32
  n_layers: 4
  activation: gelu
  optimizer: adamw
  epochs: 150
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  lr_schedule: cosine
  lr_min: 1.0e-5
  batch_size: 2
  lambda_state: 1.0
  lambda_conservation: 1.0
  lambda_tv: 0.5
  shock_weighted: true
  shock_alpha: 5.0
  checkpoint_every: 20
  save_path: hyperbolic_pde/runs/hypno_tv.pt
  eval_plots: 10
  plot_dir: hyperbolic_pde/runs/plots/hypno
#dumb comment
hypno_pinn:
  #resume_from: hyperbolic_pde/runs/hypno_pinn/run_20260325_101403/model_final.pt
  stencil_k_x: 7
  stencil_k_t: 3
  d_latent: 64
  d_hidden: 64
  d_time: 64
  n_layers: 4
  activation: gelu
  shock_mode: weno          # "pinn" or "weno" (weno with p=0 = raw MP)
  shock_delta: 0.1          # pinn mode only
  shock_threshold: 0.3      # pinn mode only
  weno_eps: 1.0e-6          # weno mode only
  weno_p: 2.0             # 0 = no WENO weighting (raw MP)
  unified_mp: true           # true = single MLP for space+time, false = separate MLPs
  readout: gelu             # activation for decoder MLP (relu for sharp shocks, gelu/tanh for smooth) THEORETICALLY
  detector_path: hyperbolic_pde/runs/shock_detector.pt  # pre-trained PINN shock detector (null = disabled)
  causal_temporal: true
  radius_x: 0.2
  radius_t: 0.15
  optimizer: adamw
  epochs: 150
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  lr_schedule: cosine
  lr_min: 5.0e-6
  batch_size: 16
  lambda_state: 1.0
  lambda_conservation: 1.0
  lambda_tv: 0.01
  lambda_pinn: 0.0
  shock_weighted: false
  shock_alpha: 3.0
  checkpoint_every: 100
  save_path: hyperbolic_pde/runs/hypno_pinn.pt
  eval_plots: 10
  plot_dir: hyperbolic_pde/runs/plots/hypno_pinn

shock_detector:
  d_latent: 128
  d_hidden: 128
  n_layers: 7
  activation: tanh              # tanh is standard for PINNs (smooth)
  epochs: 300
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  lr_min: 1.0e-5
  batch_size: 64
  lambda_pde: 1.0               # PDE residual at collocation points
  lambda_ic: 10.0               # IC enforcement: u(x,0) = u0(x)
  lambda_data: 1.5              # supervised loss on FVM ground truth
  n_collocation: 2048           # random (x,t) points per batch for PDE loss
  checkpoint_every: 20
  save_path: hyperbolic_pde/runs/shock_detector.pt
  eval_plots: 8
  plot_dir: hyperbolic_pde/runs/plots/shock_detector

fluxgnn:
  hidden: 196
  layers: 4
  activation: gelu
  optimizer: adamw
  #lbfgs_max_iter: 20
  latent_dim: 196
  flux_hidden: 196
  interface_hidden: 196
  use_base_flux: false

  base_flux_weight: 0.0
  flux_scale: 1.0
  epochs: 350
  lr: 5.0e-4
  weight_decay: 5e-5
  grad_clip: 0.6
  lr_schedule: cosine
  lr_min: 5.0e-7
  lr_step: 700
  lr_gamma: 0.5
  batch_size: 32
  checkpoint_every: 1000
  save_path: hyperbolic_pde/runs/fluxgnn.pt
  eval_plots: 10
  plot_dir: hyperbolic_pde/runs/plots/fluxgnn

