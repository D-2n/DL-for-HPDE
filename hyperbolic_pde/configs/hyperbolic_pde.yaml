seed: 42
device: cuda

data:

  path: /home/dzdrale/scratch/lwr_1d/hyperbolic_dataset_stratified.npz
  test_path: /home/dzdrale/scratch/lwr_1d/hyperbolic_dataset_stratified.npz
  path_local: /data/hyperbolic_dataset_stratified.npz
  test_path_local: /data/hyperbolic_dataset_stratified.npz
  nx: 128
  nt: 128
  x_min: -1.0
  x_max: 1.0
  t_max: 1.0
  cfl: 0.25
  # stratify=true: each (ic_type, num_segments) cell gets an equal quota.
  # num_samples must be divisible by len(ic_types)*len(num_segments).
  # 3 ic_types x 6 num_segments x 300/cell = 5400.
  stratify: true
  num_samples: 5400
  test_num_samples: 10
  test_sine_pieces: 20
  ic_types: [piecewise_constant_stratified, piecewise_sine, riemann_stratified]
  num_segments:  [2, 3, 5, 7, 10, 25]
  u_min: 0.0
  u_max: 1.0
  ic_points: 128
  method: lax_hopf              # "godunov" (1st order) or "muscl" (2nd order MUSCL-Hancock)
  boundary: ghost
  train_fraction: 0.8
  val_fraction: 0.1
  compare_samples: 10


