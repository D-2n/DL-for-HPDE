hypno_st2:
  stencil_k_x: 4
  stencil_k_t: 5
  d_latent: 64
  d_hidden: 96
  n_layers: 6
  activation: gelu
  encoder_type: gnn
  encoder_scaling: physics
  shock_mode: physics
  use_char_cone: false     # enable Gaussian char-cone component of physics gate
  shock_delta: 0.1
  shock_threshold: 0.3
  weno_eps: 1.0e-6
  weno_p: 0.5
  unified_mp: true
  readout: relu
  skip: true
  detector_path: null
  causal_temporal: true
  radius_x: null
  radius_t: null
  optimizer: adamw
  epochs: 150
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  lr_schedule: cosine
  lr_min: 1.0e-5
  batch_size: 4
  loss_type: mae             # 'mae' (L1) or 'mse' (L2) — applies to state/mass/pinn/probe terms
  lambda_state: 1.0
  lambda_conservation: 1.0
  lambda_tv: 0.0
  lambda_pinn: 0.0
  lambda_probe: 0.01          # deep supervision on per-layer state_probe u_hats
  shock_weighted: false
  shock_alpha: 3.0
  checkpoint_every: 50
  val_every: 5
  save_path: hyperbolic_pde/runs/hypno_st2.pt
  eval_plots: 10
  plot_dir: hyperbolic_pde/runs/plots/hypno_st2

hypno_st3:
  stencil_k_x: 5
  stencil_k_t: 4
  t_window: null        # random temporal window length during training (null = full nt)
  compile: false      # torch.compile the model for faster kernel fusion
  use_checkpoint: true  # gradient checkpointing on MP layers to reduce activation memory
  d_latent: 96
  d_hidden: 96
  d_hidden_nonadj: 96     # if null, defaults to d_hidden; can be set smaller (e.g. 48) since non-adj edges use 8-dim features
  n_layers: 7
  activation: gelu
  encoder_type: gnn
  encoder_scaling: classic
  shock_mode: physics
  mask_same_t_nonadj: false
  use_char_cone: false      # enable Gaussian char-cone component of physics gate
  shock_delta: 0.1
  shock_threshold: 0.3
  include_flux: false
  pure_pairwise_edges: true
  # When true, rel_x/rel_t fed to the edge MLPs are divided by dx/dt so they
  # become resolution-invariant integer-ish offsets. Makes the model transfer
  # zero-shot across grid resolutions (raw rel_x shrinks with finer grids and
  # the MLPs, trained at one scale, mis-transport shocks otherwise). NOT
  # weight-compatible with a model trained with this off — retrain or fine-tune.
  normalize_edge_offsets: false
  # --- experimental: Gaussian spatial smoothing of raw gate values ---------
  # When true, redistributes each same-time side's adjacent-gate budget over
  # the farther same-side neighbours, and each past-time slice's total gate
  # mass spatially (Gaussian centred at the query). Flag off == current model.
  use_gaussian_spatial_smoothing: false
  spatial_smoothing_adjacent_mass: 0.8   # mass kept on the immediate adjacent neighbour
  spatial_smoothing_sigma_init: 1.0      # initial learnable Gaussian width
  spatial_smoothing_sigma_min: 1.0e-4    # softplus floor on the width
  weno_eps: 1.0e-6
  weno_p: 0.5
  unified_mp: true
  readout: relu
  skip: false
  detector_path: null
  causal_temporal: true
  radius_x: null
  radius_t: null
  optimizer: adamw
  epochs: 200
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  lr_schedule: cosine
  lr_min: 1.0e-5
  batch_size: 8
  loss_type: mae             # 'mae' (L1) or 'mse' (L2) — applies to state/mass/pinn/probe terms
  lambda_state: 1.0
  lambda_conservation: 1.0
  lambda_tv: 0.0
  lambda_pinn: 0.0
  lambda_probe: 0.01          # deep supervision on per-layer state_probe u_hats
  shock_weighted: false
  shock_alpha: 3.0
  checkpoint_every: 10
  val_every: 10
  
  save_path: /home/dzdrale/scratch/runs/hypno_st3_k_x5.pt
  eval_plots: 10
  plot_dir: /home/dzdrale/scratch/runs/plots/hypno_st3
