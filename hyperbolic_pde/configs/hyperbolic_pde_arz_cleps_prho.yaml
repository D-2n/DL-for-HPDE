# The ORIGINAL (first) HypNO-ARZ -- pre-pure-pairwise 2d+12 kitchen-sink edges
# (model_arz_orig, frozen at commit 11ae6bc). Trained on the stratified
# multi-discontinuity HOMOGENEOUS set (arz_stratified_homog_prho). p=rho,
# tau=inf, so use_relaxation_features=false (7-channel node MLP) and
# lambda_balance=0. (rho,w) decoder + arz_total_loss. Modern recipe (kx7/kt5,
# 12 layers, d96, batch 16, mae) so it is comparable to the other variants.
# --model-section contains 'orig' -> --model-variant auto -> HypNO_ARZ_Orig.
hypno_arz_orig:
  stencil_k_x: 6
