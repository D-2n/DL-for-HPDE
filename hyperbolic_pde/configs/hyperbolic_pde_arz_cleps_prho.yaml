hypno_arz:
  compile: false
  save_path: /home/dzdrale/scratch/runs/hypno_arz_prho.pt
  plot_dir: /home/dzdrale/scratch/runs/plots/hypno_arz_prho

hypno_arz_riemann:
  compile: false
  save_path: /home/dzdrale/scratch/runs/hypno_arz_riemann.pt
  plot_dir: /home/dzdrale/scratch/runs/plots/hypno_arz_riemann

# HypNO-ARZ Mark 2: two-family, homogeneous ARZ only. Self-contained (the base
# config is gitignored and won't reach the cluster). Pair with the exact-Riemann
# data section (arz_riemann_exact_prho) -- Mark2 is tau=inf only.
hypno_arz_mark2:
  stencil_k_x: 6
  stencil_k_t: 4
  d_latent: 96
  d_hidden: 96
  d_hidden_nonadj: null
  n_layers: 8
  activation: gelu
  causal_temporal: true
  decoder_depth: 4
  adj_depth: 3
  nonadj_depth: 3
  update_depth: 3
  update_hidden: null
  skip: false
  use_upwind_gate: false
  normalize_edge_offsets: true
  use_checkpoint: true
  compile: false

  optimizer: adamw
  epochs: 220
  lr: 4.0e-4          # batch 8->16: sqrt(2) Adam scaling of the 3e-4 base
  weight_decay: 1.0e-4
  grad_clip: 1.0
  lr_schedule: cosine
  lr_min: 1.0e-5
  lr_warmup_steps: 180   # 2 epochs at batch 16 (90 batches/epoch) -- halved from 360
  batch_size: 16
  amp_dtype: bf16

  loss_type: mae        # mae|mse|huber; now wired into mark2_total_loss
  w_weight: 1.0
  lambda_state: 1.0
  lambda_conservation: 1.0
  lambda_probe: 0.01

  checkpoint_every: 10
  val_every: 10
  log_batch_every: 50
  diseq_threshold: 0.1

  save_path: /home/dzdrale/scratch/runs/hypno_arz_mark2.pt
  plot_dir: /home/dzdrale/scratch/runs/plots/hypno_arz_mark2
