  activation: gelu
  causal_temporal: true
  decoder_depth: 5
  skip: false
  use_relaxation_features: false
  normalize_edge_offsets: true
  use_checkpoint: true
  compile: false
  new_entropy: true       # corrected Lax entropy gate (rarefactions pass freely)

  optimizer: adamw
  epochs: 220
