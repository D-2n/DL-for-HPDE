  optimizer: adamw
  epochs: 220
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  lr_schedule: cosine
  lr_min: 5.0e-6
  lr_warmup_steps: 360
  batch_size: 8
  amp_dtype: bf16

  loss_type: mae
