# Stratified EXACT-Riemann set (5000 samples), p=rho, tau=inf. SINGLE-jump
# Riemann ICs sampled to uniformly cover the wave-structure grid:
#   2 wave types (1-shock / 1-rarefaction) x 4 one-wave strength bins x
#   4 contact strength bins. v in [0,1], rho in [0.1,0.9], vacuum-free, GT =
#   exact homogeneous Riemann solver at cell midpoints (NO FVM). Replaces the
#   2000-sample uniform arz_riemann_mark2_prho as the canonical Riemann set for
#   mark0/mark1/mark2/mark2.1. Generated by slurm/arz_gen_riemann_exact.sh.
arz_riemann_strat_prho:
  path: /home/dzdrale/scratch/arz_1d/arz_riemann_exact_prho_strat.npz
  test_path: /home/dzdrale/scratch/arz_1d/arz_riemann_exact_prho_strat.npz
  pressure_form: rho
  num_samples: 5000
  train_fraction: 0.8
  val_fraction: 0.1

# Stratified MULTI-discontinuity HOMOGENEOUS (tau=inf) set, p=rho, FV GT.
# Mixed 3-family (const + sine + Riemann), num_segments [2,3,5,7,10,25] -> many
# ICs with varying numbers of discontinuities (LWR final-stages style). For the
# ORIGINAL HypNO-ARZ (model_arz_orig). Generated by slurm/arz_gen_stratified_homog.sh.
arz_stratified_homog_prho:
  path: /home/dzdrale/scratch/arz_1d/arz_stratified_homog_prho.npz
  test_path: /home/dzdrale/scratch/arz_1d/arz_stratified_homog_prho.npz
  pressure_form: rho
  num_samples: 5400
  tau: .inf               # homogeneous -> relaxation balance term auto-disables
  train_fraction: 0.8
  val_fraction: 0.1

