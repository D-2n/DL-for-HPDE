  weight_decay: 1.0e-4
  grad_clip: 3.0
  lr_schedule: cosine
  lr_min: 5.0e-6
  lr_warmup_steps: 540   # ~2 epochs at batch 16 (4320 train / 16 ~= 270 batches/epoch)
  batch_size: 16
  amp_dtype: bf16

  loss_type: mae
  w_weight: 1.0
  lambda_state: 1.0
  lambda_conservation: 1.0
  lambda_balance: 0.0     # tau=inf (exact-Riemann) -> relaxation balance OFF
  lambda_probe: 0.01

  checkpoint_every: 10
  val_every: 10
  log_batch_every: 50
  diseq_threshold: 0.1

  save_path: /home/dzdrale/scratch/runs/hypno_arz_mark1_normal.pt
  plot_dir: /home/dzdrale/scratch/runs/plots/hypno_arz_mark1_normal
