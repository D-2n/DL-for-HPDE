# FAST variant of hypno_arz_orig: IDENTICAL architecture + recipe, plus two
# opt-in performance flags that are numerically equivalent to the default path
# (verified fp64 in tests/test_orig_fast_equiv.py), so this is NOT an A/B change
# -- it trains the SAME model, just faster. Keep hypno_arz_orig (above) as the
# canonical section; use this one for new speed-tuned runs.
#   * fast_static_cache: cache grid-only edge geometry + evaluate the lifting's
#     non-adjacent edge MLP at B=1 (point 3). Zero memory cost, exact.
#   * checkpoint_stride: checkpoint only every k-th MP layer (point 1). stride=2
#     halves the backward recompute (~faster) but raises peak memory vs stride=1.
#     Run this on the 80GB+/H200 pool; if it OOMs, drop checkpoint_stride to 1
#     (still gets the other flags + the trainer-side sync removal) or set
#     use_checkpoint:false on an H200 (141GB) for the full no-recompute speedup.
#   * fast_message_factor: factor the non-adjacent message MLP's first Linear
#     into shared block projections (point 2) -- the biggest k_x-preserving win
#     (~45% of the non-adj MLP) AND ~halves that path's activation memory.
#     fp64-equivalent (a reassociation of the same sum).
hypno_arz_orig_fast:
  stencil_k_x: 6
  stencil_k_t: 4
  d_latent: 96
  d_hidden: 96
  d_hidden_nonadj: null
  n_layers: 11
  activation: gelu
  causal_temporal: true
  decoder_depth: 5
  skip: false
  use_relaxation_features: false
  normalize_edge_offsets: true
  use_checkpoint: true
  checkpoint_stride: 2       # point 1: recompute every 2nd MP layer in backward
  fast_static_cache: true    # point 3: cache static edge geometry (exact)
  fast_message_factor: true  # point 2: factor non-adj message 1st layer (~45%)
  compile: false
  new_entropy: true

  optimizer: adamw
  epochs: 220
  lr: 4.2e-4
  weight_decay: 1.0e-4
  grad_clip: 3.0
  lr_schedule: cosine
  lr_min: 5.0e-6
  lr_warmup_steps: 540
  batch_size: 16
  amp_dtype: bf16

  loss_type: mae
  w_weight: 1.0
  lambda_state: 1.0
  lambda_conservation: 1.0
  lambda_balance: 0.0
  lambda_probe: 0.01

  checkpoint_every: 10
  val_every: 10
  log_batch_every: 50
  diseq_threshold: 0.1

  save_path: /home/dzdrale/scratch/runs/hypno_arz_orig_fast.pt
  plot_dir: /home/dzdrale/scratch/runs/plots/hypno_arz_orig_fast

# Mixed general dataset: 3 IC families x 6 num_segments x N/cell samples.
# Riemann ICs -> exact analytic GT (use_exact_riemann=True).
# piecewise_constant + piecewise_sine -> WENO5+SSP-RK3+Strang-split (fv_solver=weno5).
# tau=inf (homogeneous), p=rho, rho in [0.1,0.9], v in [0,1].
# 5400 samples = 3 families x 6 segments x 300/cell (divisible by 18).
arz_mixed_weno_prho:
  path: /home/dzdrale/scratch/arz_1d/arz_mixed_weno_prho.npz
  test_path: /home/dzdrale/scratch/arz_1d/arz_mixed_weno_prho.npz
  pressure_form: rho
  num_samples: 5400
  tau: .inf
  train_fraction: 0.8
  val_fraction: 0.1

# Mixed general dataset with WAVE-FRONT TRACKING ground truth (machine precision).
# Riemann ICs -> exact analytic GT (use_exact_riemann=True).
# piecewise_constant_stratified -> WFT (exact on shocks/contacts, rare_delta=0.002
#   on rarefactions; no diffusion, no overshoot, no crashes -- supersedes weno5).
# piecewise_sine -> HLL fallback (smooth profile not representable as fronts).
# tau=inf (homogeneous -- WFT is source-free), p=rho, rho in [0.1,0.9], v in [0,1].
# 5400 samples = 3 families x 6 segments x 300/cell (divisible by 18).
# Generate with slurm/arz_gen_mixed_wft.sh.
arz_mixed_wft_prho:
  path: /home/dzdrale/scratch/arz_1d/arz_mixed_wft_prho.npz
  test_path: /home/dzdrale/scratch/arz_1d/arz_mixed_wft_prho.npz
  pressure_form: rho
  num_samples: 5400
  tau: .inf
  train_fraction: 0.8
  val_fraction: 0.1

# CLEAN, fully WFT-exact mixed set (NO HLL). piecewise_sine is now a sine
# STAIRCASE solved by WFT, not the smooth sine that fell back to HLL. This is the
# drop-in replacement for arz_mixed_wft_prho (which had a HLL-diffused sine third).
# 6000 = 2000 x 3 families. Generate with slurm/arz_gen_mixed_wft_clean.sh.
arz_mixed_wft_clean_prho:
  path: /home/dzdrale/scratch/arz_1d/arz_mixed_wft_prho_clean.npz
  test_path: /home/dzdrale/scratch/arz_1d/arz_mixed_wft_prho_clean.npz
  pressure_form: rho
  num_samples: 6000
  tau: .inf
  # Training IC grid (unused by the trainer -- it reads the .npz; present so this
  # section can be the --train-section that defines the ID set for arz_paper_eval
  # against arz_evaluation_data). Matches slurm/arz_gen_mixed_wft_clean.sh.
  ic_types: [riemann_stratified, piecewise_constant_stratified, piecewise_sine]
  num_segments: [2, 3, 5, 7, 10]
  train_fraction: 0.8
  val_fraction: 0.1

# wft homog (5400) + exact Riemann (1000) = 6400 samples.
# Generate with: sbatch slurm/arz_gen_riemann_1k.sh && sbatch slurm/arz_merge_wft_riemann.sh
