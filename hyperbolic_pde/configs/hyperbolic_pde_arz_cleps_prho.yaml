# HypNO-ARZ Mark 2: two-family, homogeneous ARZ only. Self-contained (the base
# config is gitignored and won't reach the cluster). Pair with the exact-Riemann
# data section (arz_riemann_exact_prho) -- Mark2 is tau=inf only.
hypno_arz_mark2:
  stencil_k_x: 7
  stencil_k_t: 5
  d_latent: 96
  d_hidden: 96
  d_hidden_nonadj: null
  n_layers: 12
  activation: gelu
  causal_temporal: true
  decoder_depth: 5
  adj_depth: 3
  nonadj_depth: 3
  update_depth: 3
  update_hidden: 96
  skip: false
  use_upwind_gate: false
  normalize_edge_offsets: true
  use_checkpoint: true
  compile: false

  optimizer: adamw
  epochs: 220
  lr: 3.0e-4          # batch 8 base (no sqrt(2) bump -- that was for batch 16)
  weight_decay: 1.0e-4
  grad_clip: 1.0
  lr_schedule: cosine
  lr_min: 5.0e-6
  lr_warmup_steps: 360   # 2 epochs at batch 8 (~180 batches/epoch)
  batch_size: 8
  amp_dtype: bf16

  loss_type: mae        # mae|mse|huber; now wired into mark2_total_loss
  w_weight: 1.0
  lambda_state: 1.0
  lambda_conservation: 1.0
  lambda_probe: 0.01

  checkpoint_every: 10
  val_every: 10
  log_batch_every: 50
  diseq_threshold: 0.1

  save_path: /home/dzdrale/scratch/runs/hypno_arz_mark2.pt
  plot_dir: /home/dzdrale/scratch/runs/plots/hypno_arz_mark2

# HypNO-ARZ Mark 2.1: mark2 with ALL THREE jumps (drho, dv, dw) + both speeds
