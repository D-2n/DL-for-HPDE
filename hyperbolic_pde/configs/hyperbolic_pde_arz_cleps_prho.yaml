# === ARZ_Evaluation: dedicated paper-eval set (mirrors LWR paper_eval_data) ===
# Same num_segments grid as LWR's paper_eval_data so the "#-of-discontinuities
# ID vs OOD" story is directly comparable across PDEs. WFT machine-precision GT
# (NOT the stale tau=0.1 FV arz_paper_eval_data above, whose WENO5 baseline
# hard-crashes) so it matches the clean WFT training set the live runs use.
# Homogeneous (tau=inf), p=rho. Self-contained (base config is gitignored).
#   ic_types = the 3 families the clean WFT set trains on (riemann_stratified,
#              piecewise_constant_stratified, piecewise_sine -> sine STAIRCASE),
#              so ID family-matching works in arz_paper_eval.
#   segments = [2,3,5,7,8,10,30,40]. vs clean-WFT training segments [2,3,5,7,10]:
#              {2,3,5,7,10} are ID, {8,30,40} are OOD.
#   3 ic_types x 8 num_segments x 20/cell = 480 (divisible by 24).
#   seed 2026 != training seed 42 -> even the ID-segment cells are held-out.
#   train_fraction 0.0 -> the whole file is held-out (eval scores all 480).
# For ID/OOD labels in arz_paper_eval, pass:
#   --train-section arz_mixed_wft_clean_prho   (lists the training ic_types+segs)
# Generate with slurm/arz_gen_evaluation.sh.
arz_evaluation_data:
  path: /home/dzdrale/scratch/arz_1d/arz_evaluation_prho.npz
  test_path: /home/dzdrale/scratch/arz_1d/arz_evaluation_prho.npz
  num_samples: 480
  pressure_form: rho
  nx: 128
  nt: 128
  x_min: -1.0
  x_max: 1.0
  t_max: 1.0
  cfl: 0.4
  stratify: true
  ic_types: [riemann_stratified, piecewise_constant_stratified, piecewise_sine]
  num_segments: [2, 3, 5, 7, 8, 10, 30, 40]
  rho_min: 0.1
  rho_max: 0.9
  v_min: 0.0
  v_max: 1.0
  ic_points: 128
  boundary: ghost
  refine: 1
  tau: .inf
  use_exact_riemann: true
  fv_solver: wft
  seed: 2026
  train_fraction: 0.0
  val_fraction: 0.0

