# HypNO-ARZ Mark 1 (NORMAL, current 2d+3 pure-pairwise model) on the big
# 5400-sample exact-Riemann set. Homogeneous (tau=inf), p=rho, (rho,w) decoder +
# arz_total_loss -- the canonical pre-router mark1. Self-contained (base config
# is gitignored). Modern recipe to match mark2 (kx7/kt5, 12 layers, d96, batch 16,
# mae) so it is a clean A/B against mark2/2.1 and mark1_router. The trainer reads
# pressure_form from the .npz; relaxation features off for the homogeneous stage.
# --model-section name has no 'mark2'/'mark1_router' -> --model-variant auto -> mark1.
hypno_arz_mark1_normal:
  stencil_k_x: 7
  stencil_k_t: 5
  d_latent: 96
  d_hidden: 96
  d_hidden_nonadj: null
  n_layers: 12
  activation: gelu
  causal_temporal: true
  decoder_depth: 5
  skip: false
  use_relaxation_features: false
  normalize_edge_offsets: true
  use_checkpoint: true
  compile: false

  optimizer: adamw
  epochs: 220
