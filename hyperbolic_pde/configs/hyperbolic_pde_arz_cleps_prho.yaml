# Stratified EXACT-Riemann set (5000 samples), p=rho, tau=inf. SINGLE-jump
# Riemann ICs sampled to uniformly cover the wave-structure grid:
#   2 wave types (1-shock / 1-rarefaction) x 4 one-wave strength bins x
#   4 contact strength bins. v in [0,1], rho in [0.1,0.9], vacuum-free, GT =
#   exact homogeneous Riemann solver at cell midpoints (NO FVM). Replaces the
#   2000-sample uniform arz_riemann_mark2_prho as the canonical Riemann set for
#   mark0/mark1/mark2/mark2.1. Generated by slurm/arz_gen_riemann_exact.sh.
arz_riemann_strat_prho:
  path: /home/dzdrale/scratch/arz_1d/arz_riemann_exact_prho_strat.npz
  test_path: /home/dzdrale/scratch/arz_1d/arz_riemann_exact_prho_strat.npz
  pressure_form: rho
  num_samples: 5000
  train_fraction: 0.8
  val_fraction: 0.1

# Stratified MULTI-discontinuity HOMOGENEOUS (tau=inf) set, p=rho, FV GT.
# Mixed 3-family (const + sine + Riemann), num_segments [2,3,5,7,10,25] -> many
# ICs with varying numbers of discontinuities (LWR final-stages style). For the
# ORIGINAL HypNO-ARZ (model_arz_orig). Generated by slurm/arz_gen_stratified_homog.sh.
arz_stratified_homog_prho:
  path: /home/dzdrale/scratch/arz_1d/arz_stratified_homog_prho.npz
  test_path: /home/dzdrale/scratch/arz_1d/arz_stratified_homog_prho.npz
  pressure_form: rho
  num_samples: 5400
  tau: .inf               # homogeneous -> relaxation balance term auto-disables
  train_fraction: 0.8
  val_fraction: 0.1

# 2-channel FNO baseline on the ARZ dataset. Input (X, T, rho0, w0) -> output
# (rho, w), the SAME frame model_arz_orig / arz_total_loss optimize, so it is an
# apples-to-apples baseline against "arz hypno orig". Pair with the same data
# section orig trains on (arz_stratified_homog_prho). Recipe mirrors the LWR FNO
# (width 128, modes 24, 8 layers, cosine) but MAE loss + 220 epochs to match the
# orig run. Trained by hyperbolic_pde/arz/train_fno_arz.py (slurm/arz_train_fno.sh).
fno_arz:
  width: 128
  modes_x: 24
  modes_t: 24
  layers: 8
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  lr_schedule: cosine
  lr_min: 1.0e-5
  batch_size: 16
  epochs: 220
  loss_type: mae
  checkpoint_every: 20
  save_path: /home/dzdrale/scratch/runs/fno_arz_prho.pt
  plot_dir: /home/dzdrale/scratch/runs/plots/fno_arz_prho

# Bigger ARZ FNO (12 layers vs fno_arz's 8). Architecture must match the trained
# bigger weights (fno_arz_bigger.pt) or load_state_dict fails. For arz_mark0_paper_eval
# pass --fno-section fno_arz_bigger (the eval reads width/modes_x/modes_t/layers).
fno_arz_bigger:
  width: 128
  modes_x: 24
  modes_t: 24
  layers: 12
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
